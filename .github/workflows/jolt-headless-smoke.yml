name: Jolt WASM headless smoke test

on:
  push:
    branches:
      - ci/jolt-headless-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run embedded Jolt WASM smoke test
        run: node test/jolt-smoke.mjs
